name: Build and Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release appinst (Rootless)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Compile & Package (Rootless)
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Collect artifacts
        id: artifacts
        run: |
          # Find the compiled .deb in debs/ directory
          DEB=$(ls debs/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then
            echo "Error: No .deb package found in debs/"
            exit 1
          fi
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"
          echo "deb_name=$(basename $DEB)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: appinst ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.deb }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
